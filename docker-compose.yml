version: "3.8"

services:

  redis:
    image: redis:7
    container_name: pricing-redis
    ports:
      - "6379:6379"
  postgres:
    image: postgres:14
    container_name: pricing-postgres
    environment:
      POSTGRES_DB: pricingdb
      POSTGRES_USER: siddheshbahety
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: pricing-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricingdb
      SPRING_DATASOURCE_USERNAME: siddheshbahety
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"

volumes:
  postgres_data: