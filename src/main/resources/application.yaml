spring:
  application:
    name: pricing-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/pricingdb
    username: siddheshbahety
    password: ""
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

pricing:
  model:
    version: v1
    base-multiplier: 1.0

  demand:
    high-threshold: 0.8
    low-threshold: 0.3

  surge:
    max-multiplier: 2.5
    min-multiplier: 0.8

  cache:
    ttl-seconds: 300